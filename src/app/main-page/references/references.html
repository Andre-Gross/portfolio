<app-section-title [title]="contentService.content().mainPage.myReferences.title"></app-section-title>

<div id="all-references">
    @for (reference of contentService.content().mainPage.myReferences.references; track reference.author) {
    <div class="reference-container">
        <div class="reference-text">{{ reference.text }}</div>
        <div class="about-reference">
            <p>{{ reference.author }}</p>
            <p>{{ reference.context }}</p>
        </div>
    </div>
    }
</div>
