<div class="project-container">
  <app-headline></app-headline>


  <div class="project-details">
    <section>
      <h4>{{ project.paragraph1.header }}</h4>
      <p>{{ project.paragraph1.content }}</p>
    </section>

    <section>
      <h4>{{ project.paragraph2.header }}</h4>
      <p>{{ project.paragraph2.content }}</p>
    </section>
      <div id="project-image-wrapper">
        <img [src]="project.img.imgPath" [alt]="project.name">
        <div id="buttons">
        <button (click)="goToLink(project.img.btn1.link)">{{ project.img.btn1.text }}</button>
        <button (click)="goToLink(project.img.btn2.link)">{{ project.img.btn2.text }}</button>                                                                                            
      </div>                                                                       
    </div>

  </div>

    <section>
      <h4>{{ project.paragraph3.header }}</h4>
      <p>{{ project.paragraph3.content }}</p>
    </section>
  </div>
</div>
