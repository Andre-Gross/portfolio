<app-section-title [title]="contentService.content().mainPage.mySkillSet.title"
  (click)="triggerScroll('mySkills')"></app-section-title>


<div id=" content">
  <p id="skill-text">{{contentService.content().mainPage.mySkillSet.skillText}}</p>

  <div id="skills-container">
    @for (skill of contentService.content().mainPage.mySkillSet.skills; track skill.skillName) {
    <div class="skill-item">
      <img [src]="skill.imgPath" [alt]="skill.skillName">
      <span>{{ skill.skillName }}</span>
    </div>
    }

    <div class="motivation-item">
      {{ contentService.content().mainPage.mySkillSet.motivationText }}
    </div>
  </div>
</div>
