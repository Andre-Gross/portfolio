<p>{{ contentService.content().whyMe.aboutMe }}</p>

<div>
    <h3>{{ contentService.content().whyMe.iAm }}</h3>
    
    <div id="i-am-container">
        @for (item of contentService.content().whyMe.singleArguments | keyvalue; track item.key) {
        <div class="argument-block">
            <img src="img/why-me/{{item.key}}.svg" alt="">
            
            <p>{{ item.value }}</p>
        </div>
        }
    </div>
</div>
