<app-section-title [title]="data.title"></app-section-title>
<form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm.value)">
    <div>
        <label for="name">{{data.name}}</label>
        <input type="text" id="name" name="name" placeholder="{{data.name}}" [(ngModel)]="contact.name" required>
    </div>

    <div>
        <label for="email">{{data.email}}</label>
        <input type="email" id="email" name="email" placeholder="{{data.email}}" [(ngModel)]="contact.email"
            required email>
    </div>

    <div>
        <label for="message">{{data.message}}</label>
        <textarea id="message" name="message" placeholder="{{data.message}}" [(ngModel)]="contact.message" required>
    </textarea>
    </div>

    <div id="privacy-container">
        <input type="checkbox" id="privacy-checkbox" name="privacy-checkbox" [(ngModel)]="contact.privacyAccepted" required>
        <label id="privacy-container-text" for="privacy-checkbox">
            {{data.privacy.text1}}<a href="/privacy-policy" target="_blank">{{data.privacy.link}}</a>{{data.privacy.text2}}
        </label>
    </div>

    <button id="submit-btn" type="submit" [disabled]="!contactForm.valid">{{data.submit}}</button>
</form>
