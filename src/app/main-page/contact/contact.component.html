<app-section-title [title]="contact.title"></app-section-title>
<form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm.value)">
    <div>
        <label for="name">{{contact.name}}</label>
        <input type="text" id="name" name="name" placeholder="{{contact.name}}" [(ngModel)]="contact.name" required>
    </div>

    <div>
        <label for="email">{{contact.email}}</label>
        <input type="email" id="email" name="email" placeholder="{{contact.email}}" [(ngModel)]="contact.email"
            required email>
    </div>

    <div>
        <label for="message">{{contact.message}}</label>
        <textarea id="message" name="message" placeholder="{{contact.message}}" [(ngModel)]="contact.message" required>
    </textarea>
    </div>

    <div id="privacy-container">
        <input type="checkbox" id="privacy-checkbox" name="privacy-checkbox" [(ngModel)]="contact.privacyAccepted" required>
        <label id="privacy-container-text" for="privacy-checkbox">
            {{contact.privacy.text1}}<a href="/privacy-policy" target="_blank">{{contact.privacy.link}}</a>{{contact.privacy.text2}}
        </label>
    </div>

    <button id="submit-btn" type="submit" [disabled]="!contactForm.valid">{{contact.submit}}</button>
</form>
