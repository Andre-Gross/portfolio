<app-section-title [title]="contentService.content().contact.title"></app-section-title>


<form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
    <div>
        <label for="name">{{ contentService.content().contact.form.name }}</label>
        <input type="text" id="name" name="name" [placeholder]="contentService.content().contact.form.name"
            [(ngModel)]="contactData.name" required>
    </div>

    <div>
        <label for="email">{{ contentService.content().contact.form.email }}</label>
        <input type="email" id="email" name="email" [placeholder]="contentService.content().contact.form.email"
            [(ngModel)]="contactData.email" required email>
    </div>

    <div>
        <label for="message">{{ contentService.content().contact.form.message }}</label>
        <textarea id="message" name="message" [placeholder]="contentService.content().contact.form.message"
            [(ngModel)]="contactData.message" required>
        </textarea>
    </div>

    <div id="privacy-container">
        <input type="checkbox" id="privacy-checkbox" name="privacy-checkbox" [(ngModel)]="contactData.privacyAccepted"
            required>

        <label id="privacy-container-text" for="privacy-checkbox">
            {{ contentService.content().contact.form.privacy.text1 }}
            <a href="/privacy-policy" target="_blank">{{ contentService.content().contact.form.privacy.link }}</a>
            {{ contentService.content().contact.form.privacy.text2 }}
        </label>
    </div>

    <button id="submit-btn" type="submit" [disabled]="!contactForm.valid">
        {{ contentService.content().contact.form.submit }}
    </button>
</form>


<div id="call-to-action">
    <div>
        <p id="first-line">{{ contentService.content().contact.callToAction.firstLine }}</p>
        <p>{{ contentService.content().contact.callToAction.paragraph }}</p>
        <a href="mailto: {{ contentService.content().general.email }}">
            <img src="img/contact/mail.svg" alt="email">
            <p>E-mail: {{ contentService.content().general.email }}</p>
        </a>
        <a href="tel: {{ contentService.content().general.tel}}">
            <img src="img/contact/phone.svg" alt="phone">
            <p>Tel: {{ contentService.content().general.tel }}</p>
        </a>
    </div>

    <img src="img/next-section-arrow.png" alt="arrow">

    <div>
        <a href="">Legal notice</a>
        <a href="">privacy policy</a>
        <p>&copy; André Groß 2026</p>
    </div>
</div>

<div id="end-block"></div>
